- id: landauer1961
  title: "Irreversibility and Heat Generation in the Computing Process"
  authors: "R. Landauer"
  venue: "IBM Journal of Research and Development 5(3), 183-191"
  date: 1961-07
  doi: 10.1147/rd.53.0183
  url: https://ieeexplore.ieee.org/document/5389195
  kind: peer-reviewed-theoretical
  access: search
  supports: "Logical irreversibility implies a minimum heat generation 'of the order of kT for each irreversible function' (abstract); origin of kT ln 2 per erased bit."
  limits: "Argument made plausible rather than proven in 1961 (see later critiques and proofs, e.g. Sagawa 2014, and experimental tests)."

- id: bennett1973
  title: "Logical Reversibility of Computation"
  authors: "C. H. Bennett"
  venue: "IBM Journal of Research and Development 17(6), 525-532"
  date: 1973-11
  doi: 10.1147/rd.176.0525
  kind: peer-reviewed-theoretical
  access: search
  supports: "Any computation can be embedded in a logically reversible one (compute, copy output, uncompute) at the cost of extra steps (~2x) and temporary storage; so kT ln2 per step is not a necessary cost of computation, only of erasure."

- id: berut2012
  title: "Experimental verification of Landauer's principle linking information and thermodynamics"
  authors: "A. Berut, A. Arakelyan, A. Petrosyan, S. Ciliberto, R. Dillenschneider, E. Lutz"
  venue: "Nature 483, 187-189"
  date: 2012-03-08
  doi: 10.1038/nature10872
  kind: peer-reviewed-experimental
  access: search
  supports: "Colloidal particle in a modulated double-well potential; mean dissipated heat of erasure approaches kT ln2 in the limit of long (quasi-static) erasure cycles; excess heat grows as cycle time shortens."

- id: jun2014
  title: "High-Precision Test of Landauer's Principle in a Feedback Trap"
  authors: "Y. Jun, M. Gavrilov, J. Bechhoefer"
  venue: "Physical Review Letters 113, 190601"
  date: 2014
  doi: 10.1103/PhysRevLett.113.190601
  kind: peer-reviewed-experimental
  access: search
  supports: "Asymptotic erasure work 0.71 +/- 0.03 kT vs ln2 = 0.693 kT; dissipation in excess of kT ln2 scales ~1/tau with protocol duration tau."

- id: proesmans2020
  title: "Finite-Time Landauer Principle"
  authors: "K. Proesmans, J. Ehrich, J. Bechhoefer"
  venue: "Physical Review Letters 125, 100602"
  date: 2020-09-03
  doi: 10.1103/PhysRevLett.125.100602
  url: https://ar5iv.labs.arxiv.org/html/2006.03242
  kind: peer-reviewed-theoretical
  access: search
  supports: "Minimum average work to erase a bit in finite time exceeds kT ln2 by a term that grows as the protocol is shortened; closed form in the short-time limit."

- id: gao_limmer2021
  title: "Principles of low dissipation computing from a stochastic circuit model"
  authors: "C. Y. Gao, D. T. Limmer"
  date: 2021
  url: https://arxiv.org/abs/2102.13067
  kind: peer-reviewed-theoretical
  access: search
  supports: "Stochastic transistor-level model of NOT/NAND gates: high accuracy is achievable given enough energy and time, but at low energy accuracy and speed are coupled through device architecture."
  limits: "Journal venue not confirmed by this project (search results gave arXiv and a 2021 publication date only)."

- id: freitas2021
  title: "Stochastic Thermodynamics of Nonlinear Electronic Circuits: A Realistic Framework for Computing Around kT"
  authors: "N. Freitas, J.-C. Delvenne, M. Esposito"
  venue: "Physical Review X 11, 031064"
  date: 2021
  doi: 10.1103/PhysRevX.11.031064
  kind: peer-reviewed-theoretical
  access: search
  supports: "Thermodynamically consistent noise model of MOS transistors in subthreshold; stochastic CMOS inverter deviates from deterministic behaviour near kT-scale energies."

- id: margolus1998
  title: "The maximum speed of dynamical evolution"
  authors: "N. Margolus, L. B. Levitin"
  venue: "Physica D 120(1-2), 188-195"
  date: 1998
  doi: 10.1016/S0167-2789(98)00054-2
  url: https://arxiv.org/abs/quant-ph/9710043
  kind: peer-reviewed-theoretical
  access: search
  supports: "Minimum time to an orthogonal state t >= h/(4E) with E the mean energy above the ground state; at most ~3e33 operations per second per joule."

- id: meindl2000
  title: "The fundamental limit on binary switching energy for terascale integration (TSI)"
  authors: "J. D. Meindl, J. A. Davis"
  venue: "IEEE Journal of Solid-State Circuits 35(10), 1515-1516"
  date: 2000
  kind: peer-reviewed-theoretical
  access: search
  supports: "E_min = kT ln2 for a binary transition (with error probability 1/2 at the limit, per contemporaneous press release quoting the authors); the 2 ln2 kT/q minimum supply of an ideal CMOS inverter is attributed to this line of work by secondary sources."
  limits: "Full text not inspected; the 2 ln2 kT/q value is carried as 'via secondary'."

- id: zhirnov2003
  title: "Limits to binary logic switch scaling - a gedanken model"
  authors: "V. V. Zhirnov, R. K. Cavin, J. A. Hutchby, G. I. Bourianoff"
  venue: "Proceedings of the IEEE 91(11), 1934-1939"
  date: 2003
  kind: peer-reviewed-theoretical
  access: search
  supports: "Barrier-based binary switch model: distinguishability requires barrier E_b >~ kT ln(1/p); minimum-energy irreversible switch arguments."
  limits: "Contested by Lent and co-workers (adiabatic switching can dissipate < kT ln2); see 2007 comment/reply."

- id: swanson1972
  title: "Ion-Implanted Complementary MOS Transistors in Low-Voltage Circuits"
  authors: "R. M. Swanson, J. D. Meindl"
  venue: "IEEE Journal of Solid-State Circuits SC-7(2), 146-153"
  date: 1972-04
  kind: peer-reviewed-theoretical
  access: search
  supports: "Weak-inversion analysis of the CMOS inverter: smallest functional supply ~8 kT/q (abstract)."

- id: kish2002
  title: "End of Moore's law: thermal (noise) death of integration in micro and nano electronics"
  authors: "L. B. Kish"
  venue: "Physics Letters A 305, 144-149"
  date: 2002-12
  kind: peer-reviewed-theoretical
  access: search
  supports: "Thermal noise on shrinking node capacitances combined with falling supply voltage raises bit-error rates; motivates kT/C-based error estimates."

