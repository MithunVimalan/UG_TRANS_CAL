# Source catalogue for the UG_TRANS_CAL research project.
#
# Fields
#   id          stable key used in parameter tables and code
#   title, authors, venue, date, version, url, doi
#   kind        foundry-qualified | foundry-supplied | open-pdk | compact-model-doc |
#               peer-reviewed-experimental | peer-reviewed-theoretical | book |
#               lecture-notes | standard | open-source-code | secondary | predictive
#   access      how this project inspected it:
#                 file        - the file itself was read from a pinned git commit
#                 code        - source code read at a pinned commit
#                 search      - existence, bibliographic data and abstract-level content
#                               confirmed through a web-search service; full text NOT
#                               inspected (the container's network policy blocks
#                               publisher, arXiv and most documentation hosts)
#                 restricted  - known to exist, requires licence/NDA/registration; not inspected
#                 input-file  - cited in the user's input research file; not re-verified here
#   location    section / page / table / file path where relevant
#   cat         brief §19 area: A thermodynamics, B device physics, C compact models,
#               D foundry/PDK, E circuit design, F physical design and tools,
#               G AI accelerators, H thermal and reliability
#   supports    the specific claims or numbers this source is used for
#   limits      known limitations, supersession
#
# Research date: 2026-10-10.

